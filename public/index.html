<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title data-i18n="meta.title">Color Catchers</title>
    <meta
      name="description"
      content="Capturer des couleurs 📸🌈 !"
      data-i18n-content="meta.description"
    />
    <meta name="theme-color" content="#2d2d2d" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192-framed.png" />
    <link rel="apple-touch-icon" href="icons/icon-192-framed.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="apple-mobile-web-app-title"
      content="Color Catchers"
      data-i18n-content="meta.appleTitle"
    />

    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="pwa-install.css" />
  </head>
  <body>
    <header class="shell-header dock">
      <h1 class="ColorCatchers">
        <a
          id="communityHomepageLink"
          href="https://colorcatchers.co"
          target="_blank"
          rel="noreferrer"
        >
          <img
            src="icons/community.svg"
            alt=""
            aria-hidden="true"
            class="logo"
          />
          <span data-i18n="header.community">Communauté Color Catchers</span>
        </a>
      </h1>

      <div class="header-actions toolbar">
        <button
          class="btn-open-settings"
          type="button"
          aria-label="Ouvrir les réglages"
          data-i18n-aria-label="header.settingsOpen"
        >
          <img
            src="icons/menu.svg"
            width="24"
            height="24"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
    </header>

    <div class="capture-stage-shell">
      <div class="capture">
        <div class="capture-camera-stage" aria-hidden="true">
          <div class="camera-stage-mount" id="cameraStageMount"></div>
        </div>
        <div class="capture-palette-stage">
          <canvas id="canvas-palette"></canvas>
          <div
            class="palette-lock-overlay"
            id="paletteLockOverlay"
            aria-hidden="true"
          ></div>
        </div>

        <config-panel></config-panel>

        <settings-panel></settings-panel>

        <canvas id="canvas"></canvas>
      </div>

      <div class="ral-live-swatch" id="ralLiveSwatch" hidden>
        <div class="ral-live-swatch-color" id="ralLiveSwatchColor"></div>
        <div class="ral-live-swatch-info">
          <p class="ral-live-swatch-code" id="ralLiveSwatchCode"></p>
          <p class="ral-live-swatch-name" id="ralLiveSwatchName"></p>
          <p class="ral-live-swatch-quality" id="ralLiveSwatchQuality"></p>
        </div>
      </div>

      <section class="config-section">
        <button
          class="btn-overlay-control btn-config"
          type="button"
          aria-label="Ouvrir la configuration"
          data-i18n-aria-label="capture.configOpen"
        >
          <span class="btn-config-icon" aria-hidden="true"></span>
          <span class="btn-config-label" data-i18n="capture.configLabel"
            >Config</span
          >
        </button>
      </section>

      <section
        class="capture-mode-section"
        aria-label="Mode de capture"
        data-i18n-aria-label="capture.modeSection"
      >
        <button
          class="btn-capture-mode-toggle"
          type="button"
          data-capture-mode="palette"
        >
          RAL
        </button>
      </section>
    </div>

    <div class="sliders-container">
      <div class="swatch-slider">
        <input
          type="range"
          min="3"
          max="7"
          value="4"
          step="1"
          aria-label="Nombre de couleurs : 4"
        />
        <div class="swatch-meta">
          <span class="swatch-scale-label swatch-scale-label-min">3</span>
          <span class="swatch-count-indicator" aria-live="polite"
            >4 couleurs</span
          >
          <span class="swatch-scale-label swatch-scale-label-max">7</span>
        </div>
      </div>
    </div>

    <!-- Palette Collection Panel -->
    <shared-panel
      class="collection-panel"
      data-panel-name="collection"
      panel-title="Captures"
      close-label="Fermer les captures"
      data-i18n-panel-title="collection.panelTitle"
      data-i18n-close-label="collection.panelClose"
      hidden
    >
      <div class="collection-panel-content">
        <div class="collection-panel-body">
          <div class="collection-grid" id="collectionGrid">
            <!-- Palettes will be dynamically added here -->
          </div>
        </div>
        <div class="collection-panel-footer">
          <div class="collection-panel-toolbar toolbar">
            <button
              class="panel-icon-button panel-icon-button--toolbar collection-collapse-button"
              id="collectionCollapseAllButton"
              type="button"
              aria-label="Tout replier"
              data-i18n-aria-label="collection.collapseAll"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none">
                <path
                  d="M3.5 7.2 8 2.9l4.5 4.3M3.5 13.1 8 8.8l4.5 4.3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              class="collection-toolbar-button collection-filter-button panel-action-button"
              id="collectionFilterPublishedButton"
              type="button"
              hidden
              data-i18n="collection.filter.published"
            >
              Publiées
            </button>

            <div
              class="collection-view-switch"
              role="group"
              aria-label="Mode d'affichage des captures"
              data-i18n-aria-label="collection.viewModeGroup"
            >
              <button
                class="collection-view-option"
                id="collectionViewListButton"
                type="button"
                aria-label="Afficher les captures en liste"
                data-i18n-aria-label="collection.view.listAria"
                aria-pressed="true"
              >
                <img src="/icons/capture-list.svg" alt="" />
              </button>

              <button
                class="collection-view-option"
                id="collectionViewGridButton"
                type="button"
                aria-label="Afficher les captures en grille"
                data-i18n-aria-label="collection.view.gridAria"
                aria-pressed="false"
              >
                <img src="/icons/capture-grid.svg" alt="" />
              </button>

              <button
                class="collection-view-option"
                id="collectionViewSwatchButton"
                type="button"
                aria-label="Afficher les captures en nuancier"
                data-i18n-aria-label="collection.view.swatchAria"
                aria-pressed="false"
              >
                <img src="/icons/swatches.svg" alt="" />
              </button>
            </div>
          </div>

          <div
            class="collection-selection-bar"
            id="collectionSelectionBar"
            hidden
          >
            <span
              class="collection-selection-count"
              id="collectionSelectionCount"
              >0</span
            >
            <div class="collection-selection-actions">
              <button
                class="collection-selection-action"
                id="collectionSelectionUnpublish"
                type="button"
                data-i18n="collection.select.unpublish"
              >
                Retirer
              </button>
              <button
                class="collection-selection-action"
                id="collectionSelectionPublish"
                type="button"
                data-i18n="collection.select.publish"
              >
                Publier
              </button>
              <button
                class="collection-selection-action"
                id="collectionSelectionExport"
                type="button"
                data-i18n="collection.select.export"
              >
                Exporter
              </button>
              <button
                class="collection-selection-action collection-selection-action--delete"
                id="collectionSelectionDelete"
                type="button"
                data-i18n="collection.select.delete"
              >
                Supprimer
              </button>
            </div>
            <button
              class="collection-selection-cancel"
              id="collectionSelectionCancel"
              type="button"
              data-i18n="collection.select.cancel"
            >
              Annuler
            </button>
          </div>
        </div>
      </div>
    </shared-panel>

    <!-- Delete Account Panel -->
    <shared-panel
      class="login-panel"
      data-panel-name="delete-account"
      panel-title="Suppression du compte"
      close-label="Fermer le panneau suppression"
      data-i18n-panel-title="delete.panelTitle"
      data-i18n-close-label="delete.panelClose"
      hidden
    >
      <div class="panel-form-content">
        <section
          class="panel-form-section"
          aria-labelledby="deleteAccountTitle"
        >
          <div class="panel-form-section-header stack">
            <h3 id="deleteAccountTitle" data-i18n="delete.title">
              Supprimer mon compte
            </h3>
            <p data-i18n="delete.body">
              Cette action est irréversible. Votre compte et vos captures seront
              supprimés.
            </p>
          </div>

          <div class="panel-form-field" id="deleteAccountRequestStep">
            <button
              class="panel-form-action-button panel-form-danger-button panel-action-button"
              id="deleteAccountRequestCodeButton"
              type="button"
            >
              <span data-i18n="delete.requestCode"
                >Recevoir le code de suppression</span
              >
            </button>
            <p class="panel-form-hint" id="deleteAccountHint" hidden></p>
          </div>

          <div class="panel-form-field" id="deleteAccountVerifyStep" hidden>
            <div class="panel-form-field-header">
              <label
                class="panel-form-label"
                for="deleteAccountCodeInput"
                data-i18n="delete.codeLabel"
                >Code reçu par email</label
              >
            </div>
            <input
              class="panel-form-text-input"
              id="deleteAccountCodeInput"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="123456"
              data-i18n-placeholder="delete.codePlaceholder"
            />
            <button
              class="panel-form-action-button panel-form-danger-button panel-action-button"
              id="deleteAccountConfirmButton"
              type="button"
            >
              <span data-i18n="delete.confirm">Confirmer la suppression</span>
            </button>
          </div>
        </section>
      </div>
    </shared-panel>

    <!-- Catch Details Panel -->
    <shared-panel
      class="catch-details-panel"
      data-panel-name="catch-details"
      panel-title="Capture"
      close-label="Retour à la galerie"
      close-icon-src="icons/capture-panel-back.svg"
      data-i18n-panel-title="viewer.panelTitle"
      data-i18n-close-label="viewer.panelClose"
      hidden
    >
      <button
        class="catch-details-header-button panel-icon-button panel-icon-button--framed"
        id="catchDetailsCameraButton"
        type="button"
        slot="header-actions"
        aria-label="Retour à l'appareil photo"
        data-i18n-aria-label="viewer.backToCamera"
      >
        <img
          class="catch-details-header-icon"
          src="logo/colorcatchers.png"
          alt=""
          aria-hidden="true"
        />
      </button>

      <div class="catch-details-content">
        <div class="palette-viewer-frame">
          <div
            class="palette-viewer-track"
            id="catchDetailsTrack"
            aria-label="Captures enregistrées"
            data-i18n-aria-label="viewer.trackLabel"
          ></div>
        </div>

        <div class="ral-popover" id="ralPopover" hidden>
          <div class="ral-popover-color" id="ralPopoverColor"></div>
          <div class="ral-popover-info">
            <p class="ral-popover-code" id="ralPopoverCode"></p>
            <p class="ral-popover-name" id="ralPopoverName"></p>
            <p class="ral-popover-quality" id="ralPopoverQuality"></p>
          </div>
          <div class="ral-popover-codes">
            <p class="ral-popover-hex" id="ralPopoverHex"></p>
            <p class="ral-popover-rgb" id="ralPopoverRgb"></p>
            <p class="ral-popover-hsl" id="ralPopoverHsl"></p>
          </div>
        </div>

        <!--<div
            class="palette-viewer-swatch-strip"
            id="catchDetailsSwatchStrip"
          ></div>-->
        <div class="palette-viewer-actions">
          <button
            class="panel-icon-button panel-icon-button--viewer-action palette-action-delete"
            id="catchDetailsDeleteButton"
            type="button"
            aria-label="Supprimer la palette"
            data-i18n-aria-label="viewer.action.deleteAria"
          ></button>

          <button
            class="panel-icon-button panel-icon-button--viewer-action palette-action-publish"
            id="catchDetailsPublishButton"
            type="button"
            aria-label="Publier la palette"
            data-i18n-aria-label="viewer.action.publishAria"
          ></button>

          <button
            class="panel-icon-button panel-icon-button--viewer-action palette-action-export"
            id="catchDetailsExportButton"
            type="button"
            aria-label="Exporter la palette"
            data-i18n-aria-label="viewer.action.exportAria"
          ></button>

          <button
            class="panel-icon-button panel-icon-button--viewer-action palette-action-share"
            id="catchDetailsShareButton"
            type="button"
            aria-label="Partager la palette"
            data-i18n-aria-label="viewer.action.shareAria"
          ></button>
        </div>
      </div>
    </shared-panel>

    <!-- Btn containers -->
    <div class="btn-containers">
      <div class="camera-preview-dock" id="cameraPreviewDock">
        <video
          class="camera-feed"
          autoplay
          muted
          playsinline
          webkit-playsinline
          disablepictureinpicture
          aria-label="Aperçu caméra"
          data-i18n-aria-label="capture.cameraPreview"
        ></video>
        <div
          class="ral-reticle"
          id="ralReticle"
          hidden
          aria-hidden="true"
        ></div>
      </div>

      <div class="mini-output">
        <img class="output-img" id="photo" aria-hidden="true" hidden />
        <!-- <div class="output-palette" id="outputPalette"></div> -->
      </div>

      <div class="camera-actions toolbar">
        <button
          class="btn-capture ml-auto"
          type="button"
          aria-label="Capturer une palette"
          data-i18n-aria-label="capture.capture"
        >
          <img
            src="logo/colorcatchers.svg"
            alt=""
            class="btn-shoot"
            aria-hidden="true"
          />
        </button>

        <button
          class="btn-view-collection ml-auto"
          type="button"
          aria-label="Ouvrir les captures"
          data-i18n-aria-label="capture.collectionOpen"
        >
          <img
            class="camera-action-icon"
            src="icons/gallery.svg"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="pwa-install.js"></script>
  </body>
</html>
