<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Color Catchers</title>
    <meta name="description" content="Capturer des couleurs 📸🌈 !" />
    <meta name="theme-color" content="#2d2d2d" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192-framed.png" />
    <link rel="apple-touch-icon" href="icons/icon-192-framed.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ColorCatcher" />

    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="pwa-install.css" />
  </head>
  <body>
    <header>
      <h1 class="ColorCatchers">
        <a
          id="communityHomepageLink"
          href="https://colorcatchers.co"
          target="_blank"
          rel="noreferrer"
        >
          <img
            src="logo/colorcatchers.svg"
            alt="Logo de Color Catchers"
            class="logo"
          />
          <span>Catchers Community</span>
        </a>
      </h1>

      <div class="header-actions">
        <button
          class="btn-open-login"
          type="button"
          aria-label="Ouvrir le panneau compte"
        >
          <img
            src="icons/user-card.svg"
            width="24"
            height="24"
            alt=""
            aria-hidden="true"
          />
        </button>

        <button
          class="btn-open-settings"
          type="button"
          aria-label="Ouvrir les réglages"
        >
          <img
            src="icons/sliders.svg"
            width="24"
            height="24"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
    </header>

    <div class="capture">
      <div class="capture-camera-stage" aria-hidden="true">
        <div class="camera-stage-mount" id="cameraStageMount"></div>
      </div>
      <div class="capture-palette-stage">
        <canvas id="canvas-palette"></canvas>
      </div>

      <section class="config-section">
        <button
          class="btn-config"
          type="button"
          aria-label="Ouvrir la configuration"
        >
          <span class="btn-config-icon" aria-hidden="true"></span>
          <span class="btn-config-label">Config</span>
        </button>
      </section>

      <section class="capture-mode-section" aria-label="Mode de capture">
        <button
          class="btn-capture-mode"
          type="button"
          data-capture-mode-control="palette"
          aria-pressed="true"
        >
          Palette
        </button>
        <button
          class="btn-capture-mode"
          type="button"
          data-capture-mode-control="ral"
          aria-pressed="false"
        >
          RAL
        </button>
      </section>

      <config-panel></config-panel>

      <canvas id="canvas"></canvas>
    </div>

    <div class="sliders-container">
      <div class="swatch-slider">
        <input
          type="range"
          min="3"
          max="7"
          value="4"
          step="1"
          aria-label="Nombre de couleurs : 4"
        />
        <div class="swatch-meta">
          <span class="swatch-scale-label swatch-scale-label-min">3</span>
          <span class="swatch-count-indicator" aria-live="polite"
            >4 couleurs</span
          >
          <span class="swatch-scale-label swatch-scale-label-max">7</span>
        </div>
      </div>
    </div>

    <div class="ral-live-swatch" id="ralLiveSwatch" hidden>
      <div class="ral-live-swatch-color" id="ralLiveSwatchColor"></div>
      <div class="ral-live-swatch-info">
        <p class="ral-live-swatch-code" id="ralLiveSwatchCode"></p>
        <p class="ral-live-swatch-name" id="ralLiveSwatchName"></p>
        <p class="ral-live-swatch-quality" id="ralLiveSwatchQuality"></p>
      </div>
    </div>

    <!-- Palette Collection Panel -->
    <shared-panel
      class="collection-panel"
      data-panel-name="collection"
      panel-title="Captures"
      close-label="Fermer les captures"
      hidden
    >
      <div class="collection-panel-content">
        <div class="collection-panel-body">
          <div class="collection-grid" id="collectionGrid">
            <!-- Palettes will be dynamically added here -->
          </div>
        </div>
        <div class="collection-panel-footer">
          <div class="collection-panel-toolbar">
            <button
              class="collection-toolbar-button"
              id="collectionCollapseAllButton"
              type="button"
            >
              Tout replier
            </button>

            <div
              class="collection-view-actions"
              role="group"
              aria-label="Mode d'affichage des captures"
            >
              <div class="collection-view-action">
                <button
                  class="button-round collection-view-toggle-button"
                  id="collectionViewListButton"
                  type="button"
                  aria-label="Afficher les captures en liste"
                  aria-pressed="true"
                >
                  <img src="/icons/capture-list.svg" alt="" />
                </button>
                <span class="collection-view-toggle-legend">Liste</span>
              </div>

              <div class="collection-view-action">
                <button
                  class="button-round collection-view-toggle-button"
                  id="collectionViewGridButton"
                  type="button"
                  aria-label="Afficher les captures en grille"
                  aria-pressed="false"
                >
                  <img src="/icons/capture-grid.svg" alt="" />
                </button>
                <span class="collection-view-toggle-legend">Grille</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </shared-panel>

    <!-- Settings Panel -->
    <settings-panel></settings-panel>

    <!-- Login Panel -->
    <shared-panel
      class="login-panel"
      data-panel-name="login"
      panel-title="Compte"
      close-label="Fermer le panneau compte"
      hidden
    >
      <div class="login-content">
        <section class="settings-section" aria-labelledby="loginAccountTitle">
          <div class="settings-section-header">
            <h3 id="loginAccountTitle">Connexion</h3>
            <p id="communityAccountState"></p>
          </div>

          <div class="settings-field" id="communityEmailField">
            <div class="settings-field-header">
              <label class="settings-label" for="communityEmailInput"
                >Email</label
              >
            </div>
            <input
              class="settings-text-input"
              id="communityEmailInput"
              type="email"
              autocomplete="email"
              placeholder="votre email"
            />
            <button
              class="settings-action-button"
              id="communityRequestCodeButton"
              type="button"
            >
              Recevoir un code
            </button>
            <p class="settings-hint" id="communityAuthHint" hidden></p>
          </div>

          <div class="settings-field" id="communityCodeField" hidden>
            <div class="settings-field-header">
              <label class="settings-label" for="communityCodeInput"
                >Code reçu par email</label
              >
            </div>
            <input
              class="settings-text-input"
              id="communityCodeInput"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="123456"
            />
            <button
              class="settings-action-button"
              id="communityVerifyCodeButton"
              type="button"
            >
              Se connecter
            </button>
          </div>

          <div>
            <button
              class="settings-secondary-button"
              id="communityLogoutButton"
              type="button"
              hidden
            >
              Se déconnecter
            </button>

            <a
              class="settings-secondary-button settings-link-button"
              id="communityMyCatchesLink"
              href="#"
              hidden
            >
              Mon espace personnel
            </a>
          </div>

          <div class="settings-danger-zone">
            <button
              class="settings-secondary-button settings-danger-button"
              id="communityDeleteAccountButton"
              type="button"
              hidden
            >
              Supprimer mon compte
            </button>
          </div>
        </section>
      </div>
    </shared-panel>

    <!-- Delete Account Panel -->
    <shared-panel
      class="login-panel"
      data-panel-name="delete-account"
      panel-title="Suppression du compte"
      close-label="Fermer le panneau suppression"
      hidden
    >
      <div class="login-content">
        <section class="settings-section" aria-labelledby="deleteAccountTitle">
          <div class="settings-section-header">
            <h3 id="deleteAccountTitle">Supprimer mon compte</h3>
            <p>
              Cette action est irréversible. Ton compte et tes captures seront
              supprimés.
            </p>
          </div>

          <div class="settings-field" id="deleteAccountRequestStep">
            <button
              class="settings-action-button settings-danger-button"
              id="deleteAccountRequestCodeButton"
              type="button"
            >
              Recevoir le code de suppression
            </button>
            <p class="settings-hint" id="deleteAccountHint" hidden></p>
          </div>

          <div class="settings-field" id="deleteAccountVerifyStep" hidden>
            <div class="settings-field-header">
              <label class="settings-label" for="deleteAccountCodeInput"
                >Code reçu par email</label
              >
            </div>
            <input
              class="settings-text-input"
              id="deleteAccountCodeInput"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="123456"
            />
            <button
              class="settings-action-button settings-danger-button"
              id="deleteAccountConfirmButton"
              type="button"
            >
              Confirmer la suppression
            </button>
          </div>
        </section>
      </div>
    </shared-panel>

    <!-- Catch Details Panel -->
    <shared-panel
      class="catch-details-panel"
      data-panel-name="catch-details"
      panel-title="Capture"
      close-label="Retour à la galerie"
      close-icon-src="icons/capture-panel-back.svg"
      hidden
    >
      <button
        class="catch-details-header-button"
        id="catchDetailsCameraButton"
        type="button"
        slot="header-actions"
        aria-label="Retour à l'appareil photo"
      >
        <img
          class="catch-details-header-icon"
          src="logo/colorcatchers.png"
          alt=""
          aria-hidden="true"
        />
      </button>

      <div class="catch-details-content">
        <div class="palette-viewer-frame">
          <div
            class="palette-viewer-track"
            id="catchDetailsTrack"
            aria-label="Captures enregistrées"
          ></div>
        </div>

        <div class="ral-popover" id="ralPopover" hidden>
          <div class="ral-popover-color" id="ralPopoverColor"></div>
          <div class="ral-popover-info">
            <p class="ral-popover-code" id="ralPopoverCode"></p>
            <p class="ral-popover-name" id="ralPopoverName"></p>
            <p class="ral-popover-quality" id="ralPopoverQuality"></p>
          </div>
        </div>

        <div
          class="palette-viewer-swatch-strip"
          id="catchDetailsSwatchStrip"
        ></div>
        <div class="palette-viewer-actions">
          <button
            class="button-round palette-action-delete"
            id="catchDetailsDeleteButton"
            type="button"
            aria-label="Supprimer la palette"
          ></button>

          <button
            class="button-round palette-action-publish"
            id="catchDetailsPublishButton"
            type="button"
            aria-label="Publier la palette"
          ></button>

          <button
            class="button-round palette-action-export"
            id="catchDetailsExportButton"
            type="button"
            aria-label="Exporter la palette"
          ></button>

          <button
            class="button-round palette-action-share"
            id="catchDetailsShareButton"
            type="button"
            aria-label="Partager la palette"
          ></button>
        </div>
      </div>
    </shared-panel>

    <!-- Btn containers -->
    <div class="btn-containers">
      <div class="camera-preview-dock" id="cameraPreviewDock">
        <video
          class="camera-feed"
          autoplay
          muted
          playsinline
          webkit-playsinline
          disablepictureinpicture
          aria-label="Aperçu caméra"
        ></video>
        <div
          class="ral-reticle"
          id="ralReticle"
          hidden
          aria-hidden="true"
        ></div>
      </div>

      <div class="mini-output">
        <img class="output-img" id="photo" aria-hidden="true" hidden />
        <!-- <div class="output-palette" id="outputPalette"></div> -->
      </div>

      <div class="btns-camera">
        <div class="camera-actions">
          <button class="btn-rotate ml-auto" type="button">
            <img
              class="camera-action-icon"
              src="icons/camera-rotate.svg"
              alt=""
              aria-hidden="true"
            />
          </button>

          <button class="btn-capture" type="button">
            <img
              src="logo/colorcatchers.svg"
              alt=""
              class="btn-shoot"
              aria-hidden="true"
            />
          </button>

          <div class="btns-actions">
            <button class="btn-view-collection" type="button">
              <img
                class="camera-action-icon"
                src="icons/gallery.svg"
                alt=""
                aria-hidden="true"
              />
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
    <script src="pwa-install.js"></script>
  </body>
</html>
