<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paletcam operational logs</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.25rem; font: 14px/1.45 system-ui, sans-serif; background: #0c0c0c; color: #e8e8e8; }
  header { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
  h1 { margin: 0 1rem 0 0; font-size: 1.05rem; font-weight: 600; }
  h2 { margin: 0 0 .8rem; font-size: .85rem; color: #ccc; }
  input, button { background: #1b1b1b; color: inherit; border: 1px solid #343434; padding: .45rem .65rem; border-radius: 4px; font: inherit; }
  button { cursor: pointer; }
  #status { color: #999; font-size: .8rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
  .card { background: #181818; border: 1px solid #292929; border-radius: 8px; padding: .9rem 1rem; }
  .label { color: #999; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }
  .value { font-size: 1.35rem; margin-top: .2rem; }
  .sub { color: #999; font-size: .72rem; word-break: break-word; }
  .section { margin-bottom: 1.25rem; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { padding: .45rem; border-top: 1px solid #2b2b2b; text-align: left; vertical-align: top; }
  th { color: #999; font-weight: 500; }
  td:last-child, th:last-child { text-align: right; }
  .error { padding: .75rem 0; border-top: 1px solid #2b2b2b; }
  .error-meta { display: flex; gap: .75rem; flex-wrap: wrap; color: #999; font-size: .72rem; }
  code { color: #ffb86c; overflow-wrap: anywhere; }
  details { margin-top: .35rem; color: #999; }
  pre { max-height: 320px; overflow: auto; white-space: pre-wrap; background: #0c0c0c; padding: .6rem; color: #bbb; }
  .empty { color: #777; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Paletcam operational logs</h1>
  <input type="date" id="date">
  <button type="button" id="refresh">Refresh</button>
  <span id="status" aria-live="polite"></span>
</header>
<section class="grid" id="stats"></section>
<section class="card section">
  <h2>Top event types</h2>
  <div id="events"></div>
</section>
<section class="card section">
  <h2>Recent errors (last 50)</h2>
  <div id="errors"></div>
</section>
<script>
(() => {
  const dateInput = document.getElementById("date");
  const refreshButton = document.getElementById("refresh");
  const status = document.getElementById("status");
  const stats = document.getElementById("stats");
  const events = document.getElementById("events");
  const errors = document.getElementById("errors");
  dateInput.value = new Date().toISOString().slice(0, 10);

  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  };

  function percentile(values, percentileValue) {
    if (values.length === 0) return 0;
    const sorted = [...values].sort((left, right) => left - right);
    const index = Math.min(
      sorted.length - 1,
      Math.max(0, Math.ceil((sorted.length * percentileValue) / 100) - 1),
    );
    return sorted[index];
  }

  function isError(entry) {
    const message = String(entry.message || "");
    return /:(error|rejection)$/.test(message) || /failed|uncaught/i.test(message);
  }

  function addStat(label, value, sub = "") {
    const card = element("div", "card");
    card.append(element("div", "label", label), element("div", "value", value));
    if (sub) card.append(element("div", "sub", sub));
    stats.append(card);
  }

  function renderEventCounts(entries) {
    const counts = new Map();
    for (const entry of entries) {
      const message = String(entry.message || "(empty)");
      counts.set(message, (counts.get(message) || 0) + 1);
    }
    const rows = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
    events.replaceChildren();
    if (rows.length === 0) {
      events.append(element("div", "empty", "No events"));
      return;
    }
    const table = element("table");
    const head = element("tr");
    head.append(element("th", "", "Event"), element("th", "", "Count"));
    const thead = element("thead");
    thead.append(head);
    const tbody = element("tbody");
    for (const [message, count] of rows) {
      const row = element("tr");
      row.append(element("td", "", message), element("td", "", count));
      tbody.append(row);
    }
    table.append(thead, tbody);
    events.append(table);
  }

  function renderErrors(entries) {
    errors.replaceChildren();
    const recent = entries.filter(isError).slice(-50).reverse();
    if (recent.length === 0) {
      errors.append(element("div", "empty", "No errors"));
      return;
    }
    for (const entry of recent) {
      const item = element("article", "error");
      const meta = element("div", "error-meta");
      meta.append(
        element("span", "", new Date(entry.ts).toLocaleString()),
        element("span", "", entry.ip || ""),
        element("span", "", entry.context?.appVersion || ""),
      );
      item.append(meta, element("code", "", entry.message || ""));
      if (entry.context && Object.keys(entry.context).length > 0) {
        const details = element("details");
        details.append(element("summary", "", "Context"));
        details.append(element("pre", "", JSON.stringify(entry.context, null, 2)));
        item.append(details);
      }
      errors.append(item);
    }
  }

  function render(data) {
    const entries = Array.isArray(data.entries) ? data.entries : [];
    const failures = entries.filter(isError);
    const versions = new Set(entries.map((entry) => entry.context?.appVersion).filter(Boolean));
    const sessions = new Set(entries.map((entry) => entry.context?.correlationId).filter(Boolean));
    const timings = entries
      .map((entry) => Number(entry.context?.durationMs))
      .filter((value) => Number.isFinite(value) && value >= 0);
    stats.replaceChildren();
    addStat("Events", entries.length, data.totalLines > entries.length ? `${data.totalLines} stored` : "");
    addStat("Errors", failures.length);
    addStat("Observed sessions", sessions.size);
    addStat("Versions", versions.size, [...versions].sort().join(", "));
    if (timings.length > 0) addStat("Timing p50 / p95", `${percentile(timings, 50)} / ${percentile(timings, 95)} ms`);
    renderEventCounts(entries);
    renderErrors(entries);
  }

  async function load() {
    status.textContent = "Loading…";
    refreshButton.disabled = true;
    try {
      const response = await fetch(`/logs?date=${encodeURIComponent(dateInput.value)}&limit=5000`, {
        cache: "no-store",
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      render(data);
      status.textContent = `${data.returned || 0} entries`;
    } catch {
      status.textContent = "Unable to load logs";
    } finally {
      refreshButton.disabled = false;
    }
  }

  refreshButton.addEventListener("click", load);
  dateInput.addEventListener("change", load);
  void load();
})();
</script>
</body>
</html>
